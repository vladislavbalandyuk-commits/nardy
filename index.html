ar, only healthier.",g5:"Your collection: boards, checkers, dice, tables. Pretty checkers don’t play better. But losing with them feels nicer.",g6:"The rating — who is the best. I’m not there because I’m modest. And in the Friends tab you add your people and call them to a game.",g7:"The weekend tournament. Sign up in advance — on Saturday there are no seats, like at our place at eight. And while it runs there is «Live now» — watch other matches and comment like an expert.",g8:"The daily puzzle: one position, find the best move. Solve it — coins. Don’t — nobody will know, I won’t tell.",g9:"And this is Vlad’s course: six evenings and you play like us. Well, almost like Vlad. Like me — depends on the dice.",g10:"Your profile: avatar, nickname, Telegram link. No passport photo, please — this isn’t a bank.",g12:"Your league this week. Play people and collect points: a game 1, a win 3, a mars 4. On Sunday the top five go up and take coins, the bottom five go down. Like me after the third hookah.",g13:"Friends online. Tap «Call» — and they can’t pretend they didn’t see it.",g14:"Course done — now your friends live here. Add your people and call them to a game. Playing alone is like smoking a hookah alone: possible, but sad.",g4g:"A daily gift and quests live here — but only with an account. A guest is like a customer without a table: you can sit, but no bonuses. Sign in and take them.",g10g:"Sign in. A nickname and password or Telegram — and your coins, rating and league are kept on any device. As a guest everything lives only in this browser.",pwForgot:"Forgot password?",pwForgotT:"Password recovery",pwForgotD:"Enter the nickname you sign in with. The @dovgi_nardy_bot bot will send you a button in Telegram to set a new password.",pwSend:"Send",pwSentT:"Check Telegram",pwSentD:"The bot sent you a «Set a new password» button. The link works for 20 minutes.",pwOk:"Got it",pwNoUser:"No account with this nickname",pwNoTg:"No Telegram is linked to this account, so we can’t confirm it’s you. Write to the admin — Ka1p3r — in Telegram, he will help.",pwWait:"We just sent a link — wait a minute",pwErr:"Something went wrong — try again",pwNewT:"New password",pwNewD:"Choose a new password — at least 6 characters.",pwNew1:"New password",pwNew2:"Once more",pwSave:"Save and sign in",pwMismatch:"The passwords don’t match",pwDone:"Password changed — you are signed in",pwDoneLogin:"Password changed — sign in with the new one",pwExpired:"The link has expired. Ask for a new one with «Forgot password?»",pwTgWhy:"Link Telegram: if you ever forget your password, the bot will help you recover it.",admPwT:"Reset a password",admPwD:"For a player without Telegram who forgot the password: makes a temporary password. Make sure it is really them.",admPwNick:"Login nickname",admPwB:"Reset",admPwAsk:"Reset the password for «{n}»?",admPwOk:"{n}: temporary password {p} — pass it to the player",g11:"Settings: language, sound, notifications. Turn notifications on and I’ll remind you about the tournament. I don’t spam, I care.",chN:"Chapter {n}",chNext:"Chapter {n} →",chLocked:"Finish the previous chapter first",chDoneT:"Chapter {n} done",chAgain:"Reward already received",chList:"All chapters",chCourse:"Hookah bar evenings",chCourseD:"{n} of {m} done. Vlad and Pasha teach you to play — a gift for every chapter.",chCourseN:"{n} of {m}",chNextRw:"Reward: {r}",chStart:"Start",chCont:"Continue",chHide:"Hide from the home page",chShow:"Show on the home page",chGradT:"Course complete",chGradD:"You beat Pasha. You are a real long nardy player now — the barman is bringing a coffee on the house.",ach_grad2:"Hookah bar graduate",ch6Last:"The last chapter",ch6Fin:"A real game against Pasha. Win it for the graduation and the course’s best gifts.",ch6Prize:"+500 coins · the Hookah lounge table · 🎓",ch6LostT:"Pasha won",ch6LostD:"It happens. Pasha has ordered another hookah — he says you get a rematch.",ch6Again:"Rematch with Pasha",stRetry:"tap to try again",ch1T:"The new guy",ch1D:"How checkers move, doubles, blocked points and bearing off",ch2T:"The head is not rubber",ch2D:"The head rule and the first-roll exception",ch3T:"The fence",ch3D:"How to block your opponent, and where the limit is",ch4T:"Home!",ch4D:"When and how to bear off",ch5T:"Mars",ch5D:"How to win double",ch6T:"Pasha is not joking",ch6D:"The key tactics and a game against Pasha",ch2Fin:"You take checkers off the head like a pro now. Vlad gave you the apprentice frame.",ch3Fin:"You build fences — Pasha is nervously counting free points.",ch4Fin:"Checkers home and off the board — no wasted moves.",ch5Fin:"You know when to go for mars. Pasha asks you never to do it again.",fr_uchen:"Apprentice",dice_hookah:"Hookah",ck_coal:"Coal",tb_lounge:"Hookah lounge",tutc2aT:"The head",tutc2aD:"The head is point 24, where all your checkers start. You may take only one checker off it per turn.",tutc2bT:"The first roll is an exception",tutc2bD:"If your first roll is 6-6, 4-4 or 3-3, you may take two checkers off the head. You will roll 6 and 6 — take two.",tutc2cT:"Now only one",tutc2cD:"Later in the game, even with a double, only one checker leaves the head. You will roll 4 and 4.",tutc2dT:"The main thing about the head",tutc2dD:"Clear the head step by step, but do not wait too long: checkers stuck on the head lose the race.",c2s1:"You’re back! Same hookah, and you are almost a player.",c2s2:"Today is about the head. Point 24 — all your checkers start here.",c2s3:"The head is like the queue at the bar: one at a time, no pushing.",c2s4:"But there is an exception. A first roll of 6-6, 4-4 or 3-3 lets you take two.",c2s5:"Because one checker won’t go far alone. It’s scared.",c2s6:"Your first roll is 6 and 6. Take two checkers off the head.",c2s7:"Six-six on the first roll. Vlad, is he a card sharp?",c2s8:"He just learns from the best. From me.",c2f1:"Remember: right now you can take two off the head. Try again.",c2s9:"Now the middle of a game. A 4-4 double, but it is not the first roll.",c2s10:"So only one off the head. Even if you really want more.",c2s11:"Make four moves of 4. Only one checker off the head.",c2s12:"“The head is not rubber” — it’s written on our wall. Next to the menu.",c2s13:"Clear the head step by step, but don’t be late: whoever is late with the head loses.",c2s14:"Noted. On a napkin. Barman, don’t throw the napkin away!",tutc3aT:"The fence",tutc3aD:"One of your checkers already holds a point — your opponent cannot land there. Several points in a row are a fence: hard for the opponent to get past.",tutc3bT:"Build a fence of five",tutc3bD:"Points 11, 10, 9 and 7 are yours. You will roll 6 and 2: put a checker on 8 to get five points in a row.",tutc3cT:"Six in a row — not allowed",tutc3cD:"Six points in a row are not allowed unless at least one opponent checker is already ahead of them. Point 6 is closed for you now.",tutc3dT:"When to build a fence",tutc3dD:"Build it in front of the opponent’s checkers that are still on their head: the longer they wait, the more moves they lose.",c3s1:"Today I teach. The topic is the fence. My favourite sport.",c3s2:"One checker already holds a point. 11, 10, 9 and 7 are yours.",c3s3:"And my checkers sit on the head, watching this nervously.",c3s4:"Fill 8 and you have five points in a row. Pasha gets stuck.",c3s5:"The six: from 14 to 8. Play the two so the fence stays whole.",c3s6:"There it is. I’m stuck like in a traffic jam. Can someone pass the smoke?",c3s7:"A fence of five is almost perfect.",c3f1:"The fence broke. You need five points in a row, from 11 to 7. Again.",c3s8:"Now listen: six in a row is allowed only if an opponent checker is already ahead of it.",c3s9:"Otherwise it is not a fence, it’s a prison. Prisons are banned here. Even for me.",c3s10:"That is why point 6 is closed for you now.",c3s11:"5 and 2: try to put a checker on 6 — you can’t. Play it another way.",c3s12:"See? Point 6 won’t let you. The rule works.",c3s13:"Now you know my secret. Almost all of it.",c3s14:"Build the fence in front of the opponent’s head — that’s where it hurts most.",tutc4aT:"Home",tutc4aD:"Your home is points 1–6. You may bear off only when all 15 checkers are home.",tutc4bT:"Bring it in, then bear off",tutc4bD:"One checker is still on point 8. You will roll 3 and 5: bring it home, then bear a checker off.",tutc4cT:"The bigger die",tutc4cD:"If there is no checker on the point of the die and none higher, bear off from the highest. You will roll 6 and 5, with checkers only on 3, 2 and 1.",tutc4dT:"The smaller die",tutc4dD:"If the die is smaller than your points, move inside your home. That is a move too, and it often sets up the next one.",c4s1:"Today — home. Your home is points 1 to 6.",c4s2:"You bear off when all fifteen are home. Even one lost — you wait. Like me for the bus.",c4s3:"There it is, the lost one. Point 8.",c4s4:"3 and 5: bring the checker from 8 home, then bear one off.",c4s5:"First one gone! Barman, keep count.",c4f1:"First bring the checker from point 8 home, then bear off. Again.",c4s6:"Now you rolled 6 and 5, and checkers are only on 3, 2 and 1.",c4s7:"Then bear off from the highest point — the third.",c4s8:"Bear off two: both 6 and 5 from point 3.",c4s9:"The bigger die never goes to waste.",c4s10:"And if the die is smaller — move inside your home.",c4s11:"And remember: while you bear off, Pasha is not asleep.",c4s12:"I am. But lightly.",tutc5aT:"Mars",tutc5aD:"A normal win is one point. If you bear off all your checkers before the opponent bears off any, it’s mars: two points.",tutc5bT:"Go for mars",tutc5bD:"Pasha hasn’t borne off a single checker. You will roll 4 and 4: bear off four — one more turn to mars.",tutc5cT:"When to take risks",tutc5cD:"When ahead, don’t relax — play for mars. When behind, bear off at least one checker: it saves you from mars.",c5s1:"Today — the nicest thing. Mars.",c5s2:"And for me — the nastiest. Same thing.",c5s3:"You bore off all, the opponent none — two points instead of one.",c5s4:"Pasha has none home yet. Bear off as many as you can.",c5s5:"4 and 4: bear off four checkers.",c5s6:"One more turn and it’s mars for me. I can hear my rating crying.",c5f1:"You can bear off all four — try again.",c5s7:"So when you lead — don’t relax, go for mars.",c5s8:"And when you lose — bear off at least one. On principle.",c5s9:"Pasha’s principle is the most expensive thing on the menu.",tutc6aT:"Two plans",tutc6aD:"Long nardy has two main plans: the race (run faster) or the fence (block the opponent). Choose by the dice and the position.",tutc6bT:"Leave no one behind",tutc6bD:"The last checker on the head is the slowest. You will roll 6 and 5: bring it off the head.",tutc6cT:"A game against Pasha",tutc6cD:"Everything you know, in a real game. Beat Pasha and graduate.",c6s1:"The last evening of the course. Today — tactics.",c6s2:"My plan is to make you cry. But that’s plan B.",c6s3:"Two plans: the race or the fence. Ahead in the race — run. Behind — build a fence.",c6s4:"The last checker on the head is like a friend who fell behind. Take it first.",c6s5:"6 and 5: bring the last checker off the head.",c6s6:"We leave no one behind. Not even me when I’m losing.",c6f1:"The checker on the head is still there. Move that one — 5, then 6.",c6s7:"Now a real game. Pasha plays fair.",c6s8:"Fair and with a hookah. Sit down.",g3p:"Your coins. You get them for wins, tournaments and quests. Tap — and you are in the shop, with the daily gift and quests on the first tab. They can’t be swapped for coffee, I tried.",tourCounted:"the result counts in the tournament",tregClosed:"The tournament is already on — sign-up is closed. Next time sign up in advance.",tourPaid:"paid",tourWatch:"You are not in this tournament — watch the others play",tourPlayOn:"Play {n} · online",tourOnD:"online match against a player, one game",tourBotD:"one game",tourNextAt:"next match with {n} at {t}",tourWaitNext:"Waiting for your next opponent to be decided",tourOnWait:"Waiting for {n}. If your opponent does not come within 10 min, th  можна зняти лише одну шашку, тож обидва кубики зіграйте однією шашкою: натисніть шашку на 24 — золота позначка означає обидва кубики разом (5+3).",tut3T:"Дубль",tut3D:"Однакові числа на кубиках граються чотири рази. Киньте — випаде 4 і 4: зробіть чотири ходи по 4 пункти будь-якими шашками (з голови — так само лише одна).",tut4T:"Зайняті пункти",tut4D:"Бити шашки в довгих нардах не можна, і не можна ставати на пункт, де стоїть суперник. Випаде 3 і 1: шашки на пункті 18 піти не можуть — пункти 17 і 15 зайняті чорними. Зіграйте іншими шашками.",tut5T:"Виведення шашок",tut5D:"Коли всі 15 шашок у домі (пункти 1–6), їх можна викидати з дошки. Випаде 6 і 2: натисніть шашку на пункті 6, а потім лоток праворуч; так само зробіть із шашкою на пункті 2.",calibT:"Калібрування",calibSub:"{g} з {n} рейтингових ігор · виграно {w}",calibEnd:"Калібрування завершено",calibRes:"Ваш рейтинг — {r}",calibOk:"Поїхали",stVlad:"Влад",stPasha:"Паша",stTap:"натисніть, щоб далі",stYourMove:"ваш хід",s0a:"О, новенький! Кальян буде хвилин через десять. В нарди граєш?",s0b:"Не грає — навчимо. Сідай, за десять хвилин встигнемо.",s1a:"Твої білі. Усі п’ятнадцять стоять ось тут, на голові.",s1b:"Треба провести їх по колу в дім і винести раніше за Пашу.",s1c:"Раніше за мене ще ніхто не виносив. Ну, окрім Влада. І бармена. І вчорашнього туриста.",s2a:"Хто ходить першим — кидаємо по кубику. У тебе п’ять, у мене двійка… Кубик був холодний, не рахується.",s2b:"Рахується. Хто викинув більше — ходить першим.",s3a:"Кожен кубик — окремий хід. П’ять і три, або вісім однією шашкою.",s3b:"Але з голови за хід знімаємо лише одну. Тож веди одну шашку далеко.",s3p:"Кидай і ходи: одна шашка з голови на 5, а потім ще на 3.",s3r:"О, талант. Бармен, запиши його в постійні.",s4a:"Дубль на честь кальяну!",s4b:"Однакові числа граються чотири рази.",s4c:"Чотири ходи по чотири. Хоч однією, хоч різними.",s4p:"Зроби чотири ходи по 4.",s4r:"Чисто. Пашо, твоя черга хвилюватись.",s5a:"А тепер мій фірмовий заборчик. Пройди, якщо зможеш.",s5b:"У довгих нардах не б’ють і не стають на чужий пункт. Шукай вільний.",s5p:"Зіграй 3 і 1 на вільні пункти.",s5r:"І ще: стіну з шести пунктів підряд ставити не можна, якщо попереду немає чужої шашки. Це для Паші.",s6a:"Перемотаємо: усі п’ятнадцять уже вдома. Тепер виносимо.",s6b:"Шістка — з шостого пункту, двійка — з другого. Натисни шашку, потім лоток праворуч.",s6c:"Виносити тут тільки шашки. Посуд не треба.",s6p:"Винеси шашки на 6 і 2.",s6r:"Так і виграють.",s7a:"Перемога. А якщо Паша не виніс жодної — це марс, два очки.",s7b:"Я давав тобі виграти. Педагогічний прийом.",s7c:"Кальян готовий. Ти теж.",stFinT:"Навчання пройдено",stFinD:"Влад і Паша тепер є серед ваших аватарів.",stFinAv:"Аватари: Влад і Паша",stPlayPasha:"Зіграти з Пашею",av_vlad:"Влад",av_pasha:"Паша",luckyGame:"Щаслива партія ×2!",coinsW:"монет",coinsGot:"+{n} монет",shopSoon:"Ваші монети. Магазин скоро відкриється — збирайте далі!",stGrad:"Випускник Друзів",nickNeed:"Для рейтингових ігор потрібен нік — вкажіть його в профілі",myGamesT:"Останні ігри",myGamesNone:"На цьому пристрої ще немає ігор — зіграйте, і вони з’являться тут",plWin:"перемога",plLoss:"поразка",liveMars:"марс",botTag:"бот",agoM:"{n} хв тому",agoH:"{n} год тому",agoD:"{n} дн тому",wheelT:"Колесо чату",wheelHint:"оберіть повідомлення",wheelCd:"до наступного повідомлення",wheelEdit:"Налаштувати колесо",wheelEmpty:"Колесо порожнє",wheelFull:"У колесі максимум {m} — спершу приберіть щось",wheelN:"{n} з {m}",wheelWait:"Наступне повідомлення через {n} с",wheelHow:"До 10 емодзі й фраз, які будуть у вас у грі. Натисніть внизу, щоб додати, натисніть на слот, щоб прибрати. Писати можна раз на 15 секунд.",wheelDone:"Готово",tutorB2:"Як грати",footBeta:"Бета",langT:"Мова · Language",footNew:"Що нового",footSig:"Нарди · довгі нарди на двох · зроблено з друзями з Druzi",newsT:"Що нового",shareT:"Запросити друга",shareSub:"Надішліть посилання або дайте відсканувати QR-код камерою телефона.",shareText:"Зіграймо в довгі нарди:",shareCopy ,pzOff:"винос",pzPrize:"+{n} монет.",pzStreak:"Серія: {n} дн.",pzShow:"Показати найкращий хід",pzShown:"Найкращий хід показано",pzNone:"Сьогодні задачі немає",pzSub:"Знайдіть найкращий хід · +{n}",pzStreakKeep:"Не перервіть серію: {n} дн.",pzGo:"Розв’язати",pzDone_best:"Розв’язано — найкращий хід",pzDone_good:"Розв’язано — добрий хід",pzDone_miss:"Спроба була · нова завтра",frFindPh:"Нік друга — знайти й додати",frNone:"Нікого не знайдено",frNote:"Друзі онлайн: {n}. Покличте когось на партію — він отримає запрошення.",frEmpty:"Поки немає друзів. Знайдіть друга за ніком вище або запросіть посиланням.",frNeedReg:"Друзі доступні після входу в акаунт.",frOn:"онлайн зараз",frToday:"заходив сьогодні",frYest:"заходив учора",frDays:"заходив {n} дн. тому",frNever:"ще не заходив",frMutual:"взаємно",frAdd:"Додати в друзі",frRemoveB:"Прибрати з друзів",frAdded:"{n} у ваших друзях",frRemoved:"Прибрано з друзів",frCall:"Покликати",frCalled:"Запрошення надіслано — {n} отримає сповіщення",frOften:"Ви щойно кликали — спробуйте за хвилину",frInvT:"{n} кличе вас на партію",frInvD:"Дошка вже готова. Зіграєте?",frAccept:"Грати",frLater:"Пізніше",frInvToast:"{n} кличе вас на партію — після цієї гри",instT:"Нарди на головний екран",instI1:'Натисніть «Поділитися» <svg class="shi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> внизу Safari',instI2:"Виберіть «На початковий екран»",instI3:"Натисніть «Додати» — іконка нард з’явиться поруч з іншими застосунками",instWhy:"Так нарди відкриваються одним дотиком, на весь екран, і можуть надсилати сповіщення про турнір і ваш хід.",instOk:"Зрозуміло",instNo:"Цей браузер не вміє встановлювати застосунки — відкрийте сайт у Chrome або Safari",instThanks:"Нарди встановлено — шукайте іконку на екрані",instB:"Встановити",instRowT:"Застосунок на екран",instCardT:"Нарди як застосунок",instCardD:"Іконка на екрані, повний екран і сповіщення про турнір",chCold:"Кубики холодні",chHookah:"Кальян за мій рахунок",chOneMore:"Ще по одній?",chBot:"Це був бот, чесно",chPasha:"Пашо, це ти?",nextOpp:"Шукати нового суперника",nextBot:"Ще партія з ботом",crsLook:"Подарунок за курс «Вечори в кальянній» — у магазині не продається.",crsGo:"До курсу",crsTag:"За курс",gStep:"{i} з {n}",gSkip:"Пропустити",gNext:"Далі",gDone:"Дякую, Пашо!",gPrize:"+100 монет на перший кальян!",gSetT:"Екскурсія з Пашею",gSetB:"Показати",g1:"Я Паша, сьогодні я твій гід. Тут шукаємо, кого обіграти. А якщо обіграли тебе — кажи, що це був бот. Я завжди так кажу.",g2:"Гра з ботом — потренуватись, поки кальян розкурюється. «Створити посилання» — кидаєш другу. Не відповідає — значить, боїться.",g3:"Твої монети. Даються за перемоги, турніри й задачі. Натиснеш — потрапиш у магазин. На каву не міняються, я пробував.",g4:"Щоденний подарунок і завдання. Заходь щодня — як я на кальян, тільки корисніше.",g5:"Твоя колекція: дошки, шашки, кубики, столи. Красиві шашки не грають краще. Але програвати в них приємніше.",g6:"Рейтинг — тут видно, хто найкращий. Мене там нема, бо я скромний. А у «Друзях» додаєш своїх і кличеш на партію.",g7:"Турнір вихідного дня. Записуйся заздалегідь — у суботу місць немає, як у нас на кальян о восьмій. А коли турнір іде, тут є «Наживо зараз» — дивишся чужі матчі й коментуєш, як експерт.",g8:"Задача дня: одна позиція — знайди найкращий хід. Розв’язав — монети. Не розв’язав — ніхто не дізнається, я мовчу.",g9:"А це курс від Влада: шість вечорів — і ти граєш як ми. Ну, майже як Влад. Як я — то вже залежить від кубиків.",g10:"Профіль: аватар, нік, прив’язка Telegram. Фото з паспорта не став, тут не банк.",g12:"Твоя ліга цього тижня. Граєш з людьми — набираєш очки: партія 1, перемога 3, марс 4. У неділю п’ятірка кращих іде вище й забирає монети, остання п’ятірка — вниз. Як я після третього кальяну.",g13:"Друзі онлайн. Натиснув «Покликати» — і вже не відмажеться, що не бачив.",g14:"Курс пройдено — тепер тут друзі. Додай своїх і клич на партію. Самому грати — як самому курити кальян: можна, але сумно.",g4g:"Тут щодня подарунок і завдання — але тільки з акаунтом. Гість у нас як клієнт без столика: посидіти можна, а бонусів нема. Увійди — і забирай.",g10g:"Вхід. Нік і пароль або Telegram — і монети, рейтинг та ліга збережуться на будь-якому пристрої. Гостем усе живе лише в цьому браузері.",pwForgot:"Забули пароль?",pwForgotT:"Відновлення пароля",pwForgotD:"Введіть нік, з яким входите. Бот @dovgi_nardy_bot надішле в Telegram кнопку, щоб задати новий пароль.",pwSend:"Надіслати",pwSentT:"Перевірте Telegram",pwSentD:"Бот надіслав кнопку «Задати новий пароль». Посилання діє 20 хвилин.",pwOk:"Зрозуміло",pwNoUser:"Акаунта з таким ніком не знайдено",pwNoTg:"До цього акаунта не прив’язано Telegram, тому підтвердити, що це ви, не вийде. Напишіть адміну — Ka1p3r — у Telegram, він допоможе.",pwWait:"Ми щойно надіслали посилання — зачекайте хвилину",pwErr:"Не вдалося — спробуйте ще раз",pwNewT:"Новий пароль",pwNewD:"Придумайте новий пароль — щонайменше 6 символів.",pwNew1:"Новий пароль",pwNew2:"Ще раз",pwSave:"Зберегти й увійти",pwMismatch:"Паролі не збігаються",pwDone:"Пароль змінено — ви увійшли",pwDoneLogin:"Пароль змінено — увійдіть з новим паролем",pwExpired:"Посилання застаріло. Попросіть нове через «Забули пароль?»",pwTgWhy:"Прив’яжіть Telegram: тоді, якщо забудете пароль, бот допоможе його відновити.",admPwT:"Скинути пароль",admPwD:"Для гравця без Telegram, який забув пароль: створює тимчасовий пароль. Переконайтеся, що це справді він.",admPwNick:"Нік для входу",admPwB:"Скинути",admPwAsk:"Скинути пароль для «{n}»?",admPwOk:"{n}: тимчасовий пароль {p} — передайте гравцю, хай змінить через «Забули пароль?» або вхід",g11:"Налаштування: мова, звук, сповіщення. Увімкни сповіщення — нагадаю про турнір. Я не спамлю, я дбаю.",chN:"Розділ {n}",chNext:"Розділ {n} →",chLocked:"Спершу пройдіть попередній розділ",chDoneT:"Розділ {n} пройдено",chAgain:"Нагороду вже отримано",chList:"Усі розділи",chCourse:"Вечори в кальянній",chCourseD:"Пройдено {n} з {m}. Влад і Паша вчать грати — за кожен розділ подарунок.",chCourseN:"{n} з {m}",chNextRw:"Нагорода: {r}",chStart:"Почати",chCont:"Далі",chHide:"Сховати з головної",chShow:"Показувати на головній",chGradT:"Курс пройдено",chGradD:"Ти обіграв Пашу. Тепер ти справжній гравець у довгі нарди — бармен уже несе каву за рахунок закладу.",ach_grad2:"Випускник кальянної",ch6Last:"Останній розділ",ch6Fin:"Справжня партія з Пашею. Виграєш — випускний і головні подарунки курсу.",ch6Prize:"+500 монет · стіл «Кальянна» · 🎓",ch6LostT:"Паша виграв",ch6LostD:"Буває. Паша вже замовив ще кальян — каже, дає реванш.",ch6Again:"Реванш з Пашею",stRetry:"натисніть, щоб спробувати ще",ch1T:"Новенький",ch1D:"Як ходять шашки, дублі, зайняті пункти й виведення",ch2T:"Голова не гумова",ch2D:"Правило голови і виняток першого кидка",ch3T:"Паркан",ch3D:"Як блокувати суперника і де межа",ch4T:"Додому!",ch4D:"Коли й як виносити шашки",ch5T:"Марс",ch5D:"Як виграти подвійно",ch6T:"Паша не жартує",ch6D:"Головна тактика і партія з Пашею",ch2Fin:"Голову тепер розбираєш як професіонал. Влад видав тобі рамку учня.",ch3Fin:"Паркани будуєш — Паша вже нервово рахує вільні пункти.",ch4Fin:"Шашки додому і з дошки — без зайвих ходів.",ch5Fin:"Ти знаєш, коли добивати до марсу. Паша просить більше так не робити.",fr_uchen:"Учень",dice_hookah:"Кальянні",ck_coal:"Вугілля",tb_lounge:"Кальянна",tutc2aT:"Голова",tutc2aD:"Головою називають пункт 24, де на старті стоять усі ваші шашки. За один хід з неї можна зняти лише одну шашку.",tutc2bT:"Перший кидок — виняток",tutc2bD:"Якщо першим кидком випало 6-6, 4-4 або 3-3, з голови можна зняти дві шашки. Випаде 6 і 6 — зніміть дві.",tutc2cT:"Тепер — лише одна",tutc2cD:"Далі в грі навіть з дублем з голови знімається тільки одна шашка. Випаде 4 і 4.",tutc2dT:"Головне про голову",tutc2dD:"Розбирайте голову потроху, але не затягуйте: шашки, що застрягли на голові, програють перегони.",c2s1:"Повернувся! Кальян той самий, а ти вже майже гравець.",c2s2:"Сьогодні про голову. Пункт 24 — звідси стартують усі твої шашки.",c2s3:"Голова — це як черга до бармена: по одному, без штовханини.",c2s4:"Але є виняток. Перший кидок 6-6, 4-4 або 3-3 — можна зняти дві.",c2s5:"Бо одна шашка далеко сама не піде. Їй страшно.",c2s6:"Першим кидком випало 6 і 6. Зніми з голови дві шашки.",c2s7:"Шість-шість першим кидком. Владе, він що, шулер?",c2s8:"Він просто вчиться у найкращих. У мене.",c2f1:"Пам’ятай: зараз можна зняти з голови дві. Спробуй ще.",c2s9:"А тепер середина гри. Дубль 4-4, але це вже не перший кидок.",c2s10:"Тобто з голови — тільки одна. Навіть якщо дуже хочеться.",c2s11:"Зроби чотири ходи по 4. З голови — лише одна шашка.",c2s12:"«Голова не гумова» — це в нас на стіні написано. Поруч з меню.",c2s13:"Розбирай голову потроху, але не затягуй: хто запізнився з головою — той програв.",c2s14:"Записав. На серветці. Бармене, не викидайте серветку!",tutc3aT:"Паркан",tutc3aD:"Одна ваша шашка вже займає пункт — суперник на нього не стане. Кілька пунктів підряд — це паркан: через нього суперникові важко пройти.",tutc3bT:"Збудуйте паркан з п’яти",tutc3bD:"Пункти 11, 10, 9 і 7 уже ваші. Випаде 6 і 2: поставте шашку на 8, щоб вийшло п’ять пунктів підряд.",tutc3cT:"Шість підряд — не можна",tutc3cD:"Шість пунктів підряд ставити заборонено, якщо попереду них немає жодної шашки суперника. Пункт 6 зараз недоступний.",tutc3dT:"Коли будувати паркан",tutc3dD:"Будуйте паркан перед шашками суперника, що ще не вийшли з голови: що довше вони стоять, то більше ходів він втрачає.",c3s1:"Сьогодні я вчу. Тема — паркан. Мій улюблений вид спорту.",c3s2:"Одна шашка вже тримає пункт. 11, 10, 9 і 7 — твої.",c3s3:"А мої шашки стоять на голові й дивляться на це з тривогою.",c3s4:"Заповни 8 — і буде п’ять пунктів підряд. Паша застрягне.",c3s5:"Шістка — з 14 на 8. Двійку зіграй так, щоб паркан не розвалився.",c3s6:"Ну ось. Сиджу як у пробці. Мені хтось дим подасть?",c3s7:"Паркан з п’яти — майже ідеал.",c3f1:"Паркан розвалився. Потрібно п’ять пунктів підряд — від 11 до 7. Ще раз.",c3s8:"А тепер увага: шість підряд можна, тільки якщо попереду вже є хоч одна чужа шашка.",c3s9:"Інакше це не паркан, а тюрма. Тюрми в нас заборонені. Навіть для мене.",c3s10:"Тому пункт 6 зараз закритий для тебе.",c3s11:"5 і 2: спробуй поставити шашку на 6 — не вийде. Зіграй інакше.",c3s12:"Бачиш? Шостий пункт не дається. Правило працює.",c3s13:"Тепер ти знаєш мій секрет. Майже весь.",c3s14:"Будуй паркан перед головою суперника — там він найболючіший.",tutc4aT:"Додому",tutc4aD:"Ваш дім — пункти 1–6. Виносити шашки з дошки можна лише тоді, коли всі 15 удома.",tutc4bT:"Заведіть і виносьте",tutc4bD:"Одна шашка ще на пункті 8. Випаде 3 і 5: заведіть її додому, а потім винесіть шашку.",tutc4cT:"Більший кубик",tutc4cD:"Якщо на пункті з числом кубика шашок немає і вище теж — виносимо з найвищого. Випаде 6 і 5, а шашки лише на 3, 2 і 1.",tutc4dT:"Менший кубик",tutc4dD:"Якщо кубик менший за ваші пункти — ходіть усередині дому. Це теж хід, і він часто готує наступний.",c4s1:"Сьогодні — додому. Твій дім — пункти від 1 до 6.",c4s2:"Виносити можна, коли вдома всі п’ятнадцять. Навіть одна загубилась — чекаєш. Як я маршрутку.",c4s3:"Ось вона, загублена. Пункт 8.",c4s4:"3 і 5: заведи шашку з 8 додому, а потім винеси.",c4s5:"Перша пішла! Бармене, рахуйте.",c4f1:"Спершу заведи шашку з пункту 8 додому, а потім виноси. Ще раз.",c4s6:"Тепер випало 6 і 5, а шашки лише на 3, 2 і 1.",c4s7:"Тоді виносимо з найвищого пункту — з третього.",c4s8:"Винеси дві шашки: 6 і 5 — обидві з пункту 3.",c4s9:"Більший кубик ніколи не пропадає.",c4s10:"А якщо кубик менший — ходиш усередині дому.",c4s11:"І не забувай: поки виносиш, Паша теж не спить.",c4s12:"Сплю. Але чутливо.",tutc5aT:"Марс",tutc5aD:"Звичайна перемога — одне очко. Якщо ви винесли всі шашки, а суперник ще жодної — це марс, два очки.",tutc5bT:"Добийте до марсу",tutc5bD:"У Паші жодної винесеної шашки. Випаде 4 і 4: винесіть чотири шашки — до марсу лишиться один хід.",tutc5cT:"Коли ризикувати",tutc5cD:"Коли ви попереду — не розслабляйтесь, грайте на марс. Коли позаду — винесіть хоча б одну шашку: це рятує від марсу.",c5s1:"Сьогодні про найприємніше. Марс.",c5s2:"А я про найнеприємніше. Те саме.",c5s3:"Виніс усі, а суперник ще жодної — два очки замість одного.",c5s4:"У Паші ще жодної вдома. Винеси якнайбільше.",c5s5:"4 і 4: винеси чотири шашки.",c5s6:"Ще хід — і мені марс. Я, здається, чую, як плаче мій рейтинг.",c5f1:"Можна винести всі чотири — спробуй ще раз.",c5s7:"Тому коли ведеш — не розслабляйся, добивай до марсу.",c5s8:"А коли програєш — винеси хоч одну. З принципу.",c5s9:"Принцип Паші — найдорожчий у закладі.",tutc6aT:"Два плани",tutc6aD:"У довгих нардах два головні плани: перегони (бігти швидше) або паркан (заблокувати суперника). Обирайте за кубиками й позицією.",tutc6bT:"Нікого не кидаємо",tutc6bD:"Остання шашка на голові — найповільніша. Випаде 6 і 5: проведіть її з голови.",tutc6cT:"Партія з Пашею",tutc6cD:"Все, що ви знаєте, — у справжній грі. Виграйте в Паші й отримайте випускний.",c6s1:"Останній вечір курсу. Сьогодні — тактика.",c6s2:"Мій план — щоб ти розплакався. Але він запасний.",c6s3:"Два плани: перегони або паркан. Ведеш у перегонах — біжи. Відстаєш — будуй паркан.",c6s4:"Остання шашка на голові — як друг, що відстав. Спершу забери її.",c6s5:"6 і 5: проведи останню шашку з голови.",c6s6:"Нікого не кидаємо. Навіть мене, коли я програю.",c6f1:"Шашка на голові досі стоїть. Проведи саме її — 5, а потім 6.",c6s7:"Тепер справжня партія. Паша грає чесно.",c6s8:"Чесно і з кальяном. Сідай.",g3p:"Твої монети. Даються за перемоги, турніри й завдання. Натиснеш — потрапиш у магазин, а там на першій вкладці щоденний подарунок і завдання. На каву не міняються, я пробував.",tourCounted:"результат зараховано в турнір",tregClosed:"Турнір уже йде — запис на нього закрито. Наступного разу запишіться заздалегідь.",tourPaid:"нараховано",tourWatch:"Ви не в цьому турнірі — дивіться, як грають інші",tourPlayOn:"Грати з {n} · онлайн",tourOnD:"
