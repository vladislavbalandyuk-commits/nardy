<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long Nardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#ebe5d9; --panel:#f6f2ea; --ink:#1d1915; --ink2:#3a332b; --muted:#7a7166; --line:#d6ccbb; --line2:#e3dbcd;
  --accent:#8e2f1f; --hl:#e9a21a; --hl2:#e9a21a; --hlSoft:rgba(233,162,26,.28);
  --serif:"Jost",system-ui,sans-serif; --sans:"Jost",system-ui,sans-serif; --mono:"Jost",system-ui,sans-serif;
  --hud:340px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border-radius:8px;padding:12px 16px;font-weight:500;letter-spacing:.02em;color:var(--ink);background:transparent;border:1px solid var(--ink2);transition:background .15s,color .15s,border-color .15s,opacity .15s}
button:hover{background:rgba(29,25,21,.06)}
button.cta{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button.cta:hover{background:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.3;cursor:default;background:transparent}
button.cta:disabled{background:var(--ink);color:var(--panel)}
.hidden{display:none!important}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}

.app{display:grid;grid-template-columns:1fr var(--hud);grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;padding:18px 28px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;cursor:pointer}
.brand b{font:700 19px/1 var(--serif);letter-spacing:.22em;text-transform:uppercase}
.brand small{color:var(--muted);font-size:14px;font-weight:400}
.hdr-r{display:flex;align-items:center;gap:18px;font-size:14px}
.seg{display:flex;gap:2px;align-items:center}
.seg button{border:0;padding:4px 6px;border-radius:4px;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:.12em}
.seg button.on{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.seg button + button::before{content:"/";color:var(--line);margin-right:8px;text-decoration:none;display:inline-block}
.me{border:0;padding:4px 0;display:flex;align-items:center;gap:8px;font-size:14px}
.me:hover{background:transparent;color:var(--accent)}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 12px var(--sans);color:var(--panel);background:var(--ink);flex-shrink:0}
.av.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.av.big{width:56px;height:56px;font-size:20px;margin:0 0 10px}

#stage{position:relative;min-height:0;min-width:0}
.toastbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:14px;white-space:nowrap;pointer-events:none;z-index:5}

.hud{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
.hud-v{display:flex;flex-direction:column}
.sec{padding:20px 24px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:0}
h1{font:300 46px/1.02 var(--serif);margin:0 0 12px;letter-spacing:-.02em}
h2{font:400 28px/1.15 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
h3{font:500 18px/1.3 var(--sans);margin:0 0 4px}
p{margin:0}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:13px;line-height:1.5}
.opt p{color:var(--muted);font-size:14px;margin-bottom:12px}
.opt button{width:100%}

.linkbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 5px 5px 12px;margin:14px 0;background:#fff}
.linkbox code{flex:1;font:13px/1.2 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbox button{padding:8px 12px;font-size:14px}
.pulse{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pulse i{width:7px;height:7px;border-radius:50%;background:var(--hl);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

.pl{display:flex;align-items:center;gap:12px;padding:10px 0;position:relative}
.pl + .pl{border-top:1px solid var(--line2)}
.pl.turn::before{content:"";position:absolute;left:-24px;top:10px;bottom:10px;width:3px;background:var(--ink);border-radius:0 2px 2px 0}
.chip{width:26px;height:26px;border-radius:50%;flex-shrink:0}
.chip.w{background:var(--ckwBg);box-shadow:0 1.5px 0 var(--ckwEdge)}
.chip.b{background:var(--ckbBg);box-shadow:0 1.5px 0 var(--ckbEdge)}
.chip.n{border:1px dashed var(--line)}
.pav{position:relative;flex-shrink:0;width:40px;height:40px}
.pav .av{width:38px;height:38px;font-size:14px}
.pav{display:flex;align-items:center;justify-content:center;width:46px;height:46px}
.pav .chip.mini{right:-1px;bottom:-1px;z-index:3}
.chip.mini{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border:2px solid var(--panel);box-sizing:content-box}
.av.img{background:none;overflow:hidden;padding:0}
.av.img svg{width:100%;height:100%;display:block;border-radius:50%}
.fr{position:relative;display:inline-flex;border-radius:50%;padding:var(--fw,3px);flex-shrink:0;vertical-align:middle}
.fr::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fbg);z-index:0}
.fr>.av{position:relative;z-index:1}
.fr.t1{--fw:2.5px;--fbg:linear-gradient(145deg,#e6a874,#a3622f 55%,#6b3816)}
.fr.t2{--fw:3px;--fbg:linear-gradient(145deg,#ffffff,#bfc5cc 50%,#7b828b);box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px #a4abb4}
.fr.t3{--fw:3.5px;--fbg:linear-gradient(145deg,#fff1b8,#e2ae3c 45%,#9a6a14)}
.fr.t3::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:repeating-conic-gradient(#d9a53c 0 7deg,transparent 7deg 22.5deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.fr.t4{--fw:4px;--fbg:linear-gradient(145deg,#f2feff,#86d6dd 50%,#2c8992);box-shadow:0 0 12px rgba(70,190,200,.5)}
.fr.t4::after{content:"";position:absolute;left:50%;bottom:-4px;width:9px;height:9px;margin-left:-4.5px;transform:rotate(45deg);background:linear-gradient(135deg,#ffffff,#6fd3dc);box-shadow:0 0 0 1.5px #2c8992;z-index:2;border-radius:1.5px}
.fr.t5{--fw:4px;--fbg:conic-gradient(#8ef3ff,#b38cff,#ff9fd6,#fff3a6,#8ef3ff);box-shadow:0 0 16px rgba(170,140,255,.55)}
.fr.t5::before{animation:frspin 5s linear infinite}
.fr.t5::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:linear-gradient(135deg,#ffffff,#b9f4ff 50%,#b38cff);box-shadow:0 0 0 1.5px #7a5bd6,0 0 8px #c9b6ff;z-index:2;border-radius:2px}
@keyframes frspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fr.t5::before{animation:none}}
.me .fr{margin:2px}
.rank{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:2px 0 14px;background:#fff}
.rank .rt{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rank .rt b{font-weight:600;font-size:17px}
.rank .rt span{font-size:26px;font-weight:300}
.rank .rbar{height:6px;border-radius:3px;background:var(--line2);margin:8px 0 6px;overflow:hidden}
.rank .rbar i{display:block;height:100%;border-radius:3px;background:var(--ink)}
.rank .nx{font-size:12.5px;color:var(--muted)}
.ranks{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0 2px;text-align:center}
.ranks div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding-top:6px}
.ranks div.cur{color:var(--ink);font-weight:600}
.ranks .av{width:34px;height:34px;font-size:12px}
.tierlbl{font-weight:500}
.modal{max-height:calc(100vh - 32px);overflow:auto}
.av.big{margin:0}
.modal > .fr{margin:4px 0 12px}
.lb .lbrow{display:grid;grid-template-columns:34px 52px 1fr auto;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--line2)}
.lb .lbrow:first-child{border-top:0}
.lb .lbrow.me{background:rgba(29,25,21,.05);border-radius:10px}
.lb .pos{font-size:18px;font-weight:300;text-align:center;color:var(--muted)}
.lb .pos.g1{color:#c99a2e;font-weight:600}.lb .pos.g2{color:#8d949c;font-weight:600}.lb .pos.g3{color:#a3622f;font-weight:600}
.lb .who{min-width:0}
.lb .who b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .who span{font-size:12.5px;color:var(--muted)}
.lb .rt{font-size:24px;font-weight:300;text-align:right}
.lb .rt small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.lb .av{width:38px;height:38px;font-size:13px}
.lb .empty{padding:24px 6px;color:var(--muted);text-align:center}
.frl{display:inline-block;flex-shrink:0;vertical-align:middle;position:relative;line-height:0}
.frl svg{width:100%;height:100%;display:block;overflow:visible}
.av.img svg{width:100%;height:100%;display:block;border-radius:50%}
.pav{width:auto;height:auto}
.pav .chip.mini{right:4px;bottom:4px}
.me .frl{margin:-8px -2px -8px -8px!important}
.me{gap:10px}
.modal > .frl{margin:0 0 10px!important}
.onl{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:12px}
.onl i{width:8px;height:8px;border-radius:50%;background:#3fa463;box-shadow:0 0 0 3px rgba(63,164,99,.18)}
.onl.hdr{margin:0;white-space:nowrap}
.onl.hdr::before{content:"";width:8px;height:8px;border-radius:50%;background:#3fa463;box-shadow:0 0 0 3px rgba(63,164,99,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.searchbox{display:flex;align-items:center;gap:14px;margin-top:16px}
.searchbox b{display:block;font-size:28px;font-weight:300}
.searchbox span{font-size:13px;color:var(--muted)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.coach{background:#fff;border-left:3px solid var(--hl)}
.coachstep{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.coach h3{font-size:19px;margin-bottom:6px}
.coach p{font-size:15px;line-height:1.55;color:var(--ink2);margin-bottom:14px}
@media (max-width:860px){ .onl.hdr{display:none} }
.onl.hdr:empty{display:none}
.onl:has(span:empty){display:none}
.pav{position:relative;width:58px;height:58px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pav .frl{margin:0!important}
.pav .chip.mini{right:2px;bottom:2px;z-index:3}
.tb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;min-width:230px;max-width:80%;padding:16px 22px 18px;border-radius:16px;text-align:center;
  background:rgba(246,242,234,.97);color:var(--ink);box-shadow:0 18px 40px -12px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.06);animation:tbIn .32s cubic-bezier(.2,.9,.3,1.2)}
.tb.wait{background:rgba(22,20,18,.78);color:#f3eee5;box-shadow:0 14px 30px -14px rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tb .tbt{font-size:22px;font-weight:500;line-height:1.2}
.tb .tbs{font-size:13.5px;opacity:.7;margin-top:4px}
.tb button{margin-top:12px;min-width:170px}
.tb .dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@keyframes tbIn{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (max-width:640px){.tb{min-width:0;padding:9px 14px 11px;border-radius:12px}.tb .tbt{font-size:16px}.tb .tbs{font-size:11.5px;margin-top:2px}.tb button{min-width:0;margin-top:8px;padding:8px 16px;font-size:13.5px;height:auto}}
#ctlSec .status,#ctlSec .row2{display:none} #ctlSec #btnNew{margin-top:0!important}
.hist{margin-top:10px;max-height:300px;overflow:auto;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.hist .hr{display:grid;grid-template-columns:26px 14px 34px 1fr;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.hist .hr:first-child{border-top:0}
.hist .hn{color:var(--muted);font-size:12px}
.hist .hd{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.hist .hd.w{background:#f4efe6} .hist .hd.b{background:#2a2622}
.hist .hx{font-weight:600}
.hist .hm{color:var(--ink2);word-spacing:3px}
.hist .hr.cur .hm{color:var(--muted)}
.hist .empty{color:var(--muted);padding:4px 0}
.ub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:44px;height:44px;padding:0!important;border-radius:50%!important;display:flex;align-items:center;justify-content:center;
  background:rgba(246,242,234,.95)!important;color:var(--ink)!important;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);border:0!important}
.ub .i{width:18px;height:18px}
@media (max-width:640px){.ub{width:34px;height:34px}.ub .i{width:14px;height:14px}}
.avpick{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.avopt{border:0;padding:3px;border-radius:50%;background:transparent}
.avopt:hover{background:transparent}
.avopt .av{width:48px;height:48px;font-size:15px}
.avpick{gap:6px}
.avopt.on{box-shadow:0 0 0 2px var(--ink)}
.pl .nm{font-weight:500;font-size:17px;letter-spacing:.005em}
.pl .sub{font-size:13px;color:var(--muted);letter-spacing:.01em}
.pl .sc{margin-left:auto;font:300 38px/1 var(--mono);letter-spacing:-.02em}
.status{font-size:17px;line-height:1.45;font-weight:400;min-height:46px;margin-bottom:14px;transition:opacity .2s}
.status b{font-weight:600}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px}
.row2 button.icon{padding:0 13px}
.set{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:15px}
.tog{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--ink)} .tog.on::after{left:18px}
.share{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.share span{flex:1}
.share button{padding:8px}
details.rules{font-size:14px;color:var(--ink2);line-height:1.55}
details.rules summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.rules summary::after{content:"+";color:var(--muted)}
details.rules[open] summary::after{content:"–"}
details.rules summary::-webkit-details-marker{display:none}
details.rules ol{padding-left:18px;margin:10px 0 0}
details.rules li{margin:5px 0}
.keys{font-size:12px;color:var(--muted);padding:14px 24px}
kbd{font:11px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line);background:#fff}

.overlay{position:fixed;inset:0;background:rgba(29,25,21,.42);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border-radius:12px;padding:28px;max-width:380px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.modal p{color:var(--muted);margin:0 0 18px;font-size:15px}
.modal .r{display:flex;gap:8px}
.modal .r button{flex:1}
.modal label{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.field{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;margin:6px 0 14px}
.field:focus{border-color:var(--ink)}
.modal .col{display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;margin:6px 0 18px}
.stats div{padding:10px 12px}
.stats div + div{border-left:1px solid var(--line)}
.stats b{display:block;font:300 28px/1.1 var(--mono)}
.stats span{font-size:12px;color:var(--muted)}
.orline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0 6px}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
.modal .field{margin:6px 0 8px}
.linkbtn{border:0;color:var(--muted);padding:8px}
.linkbtn:hover{background:transparent;color:var(--accent)}

/* ---------- 2D board ---------- */
#stage{display:flex;align-items:center;justify-content:center;padding:10px}
.bw{display:flex;gap:calc(var(--cs)*.2);user-select:none;-webkit-user-select:none;touch-action:manipulation}
/* Classic: maple frame, light wood field, walnut & cherry points */
.board,.tray,.mb{--frame:#2c221b;--frame2:#1e1712;--field:#27392f;--field2:#203028;--p1:rgba(240,228,204,.20);--p2:rgba(8,12,10,.38);--num:rgba(255,255,255,.38);--edge:rgba(0,0,0,.4);--grain:transparent;--bar:#16110d;--trayIn:rgba(0,0,0,.25);--tc:rgba(255,255,255,.6)}
.board[data-b=modern],.tray[data-b=modern],.mb[data-b=modern]{--frame:#d9cdb9;--frame2:#c7b89e;--field:#f1eadf;--field2:#e8dfd0;--p1:rgba(150,118,78,.30);--p2:rgba(70,52,34,.16);--num:rgba(60,40,20,.45);--edge:rgba(80,60,30,.18);--grain:transparent;--bar:#b9a88b;--trayIn:rgba(80,60,30,.12);--tc:rgba(50,35,20,.6)}
.board{display:flex;padding:calc(var(--cs)*.36) calc(var(--cs)*.28);border-radius:calc(var(--cs)*.36);position:relative;
  background:linear-gradient(165deg,var(--frame),var(--frame2));
  box-shadow:0 34px 60px -28px rgba(50,30,10,.55), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.25)}
.tray{width:calc(var(--cs)*1.12);border-radius:calc(var(--cs)*.36);padding:calc(var(--cs)*.36) calc(var(--cs)*.16);display:flex;flex-direction:column;gap:calc(var(--cs)*.3);
  background:linear-gradient(165deg,var(--frame),var(--frame2));box-shadow:0 34px 60px -28px rgba(50,30,10,.55), inset 0 1px 0 rgba(255,255,255,.25)}
.half{width:calc(var(--cs)*6);height:calc(var(--cs)*11.4);border-radius:calc(var(--cs)*.12);position:relative;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(130% 90% at 50% 50%,var(--field),var(--field2));box-shadow:inset 0 0 0 1px var(--edge), inset 0 4px 14px rgba(0,0,0,.18)}
.bar{width:calc(var(--cs)*.42);position:relative}
.bar::after{content:"";position:absolute;left:50%;top:4%;bottom:4%;width:calc(var(--cs)*.08);margin-left:calc(var(--cs)*-.04);border-radius:4px;background:var(--bar);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.prow{display:flex;height:calc(var(--cs)*5.2)}
.pt{width:var(--cs);height:100%;position:relative;cursor:pointer}
.pt::before{content:"";position:absolute;top:calc(var(--cs)*.06);bottom:0;left:13%;right:13%;border-radius:calc(var(--cs)*.4);background:linear-gradient(180deg,var(--p1) 0%,var(--p1) 45%,transparent 100%);transition:background .25s, box-shadow .25s}

// ---------- rules engine ----------
const S = c => c==='w'?1:-1;
const OPP = c => c==='w'?'b':'w';
const b2 = (c,p) => c==='w' ? p : (p+12)%24;     // path position -> board index
const p2 = (c,b) => c==='w' ? b : (b+12)%24;     // board index -> path position
const mine = (B,c,p) => B[b2(c,p)]*S(c);

function allHome(st,c){ let n=st.off[c]; for(let p=18;p<24;p++){const k=mine(st.board,c,p); if(k>0)n+=k;} return n===15; }
function blockIllegal(B,c){
  const o=OPP(c); let run=0;
  for(let p=0;p<24;p++){
    if(mine(B,c,p)>0){ run++;
      if(run>=6){ const oq=(p-5+12)%24;
        if(oq+5<=23){ let ahead=false; for(let op=oq+6;op<24;op++){ if(mine(B,o,op)>0){ahead=true;break;} } if(!ahead) return true; }
      }
    } else run=0;
  }
  return false;
}
function genSingles(st,c,d){
  const res=[], B=st.board, home=allHome(st,c);
  let minP=24; for(let p=0;p<24;p++) if(mine(B,c,p)>0){minP=p;break;}
  for(let p=0;p<24;p++){
    if(mine(B,c,p)<=0) continue;
    if(p===0 && st.headMoved>=st.headLimit) continue;
    const t=p+d;
    if(t<24){
      const bi=b2(c,t); if(B[bi]*S(c)<0) continue;
      const nb=B.slice(); nb[b2(c,p)]-=S(c); nb[bi]+=S(c);
      if(blockIllegal(nb,c)) continue;
      res.push({from:p,to:t,die:d});
    } else if(home && (t===24 || p===minP)) res.push({from:p,to:24,die:d});
  }
  return res;
}
function applyMove(st,c,m){
  const B=st.board.slice(); B[b2(c,m.from)]-=S(c);
  const off={...st.off}; if(m.to===24) off[c]++; else B[b2(c,m.to)]+=S(c);
  const rem=st.remaining.slice(); rem.splice(rem.indexOf(m.die),1);
  return {...st,board:B,off,remaining:rem,headMoved:st.headMoved+(m.from===0?1:0)};
}
function maxUse(st,c){
  if(!st.remaining.length) return 0; let best=0;
  for(const d of new Set(st.remaining)) for(const m of genSingles(st,c,d)){
    const v=1+maxUse(applyMove(st,c,m),c); if(v>best) best=v; if(best===st.remaining.length) return best;
  }
  return best;
}
function legalMoves(st,c){
  if(!st.remaining || !st.remaining.length) return [];
  const total=maxUse(st,c); if(!total) return [];
  let res=[];
  for(const d of new Set(st.remaining)) for(const m of genSingles(st,c,d)) if(1+maxUse(applyMove(st,c,m),c)===total) res.push(m);

    const mx=Math.max(...res.map(m=>m.die)); res=res.filter(m=>m.die===mx);
  }

}

function botEval(st,c){

    if(!gs.rolled){ const d1=d6(), d2=d6(); gs.dice=[d1,d2]; gs.remaining=d1===d2?[d1,d1,d1,d1]:[d1,d2]; gs.headLimit=(gs.first[c]&&d1===d2&&[3,4,6].includes(d1))?2:1; gs.first[c]=false; gs.headMoved=0; gs.rolled=true; gs.trail=[]; gs.rollId++; gs.snap=null; rollAnimUntil=performance.now()+700; sfx('dice'); botBusy=true; scene3d&&scene3d.sync(); renderHud(); }
    await botWait(900); if(stale()) return;
    const path=botBestPath(gs,c);
    if(!path || !path.length){ toast(t('botNoMoves')); await botWait(900); if(stale()) return; passTurn(); botBusy=false; route(); return; }
    for(let i=0;i<path.length;i++){ if(stale()) return; playPath([path[i]]); if(i<path.length-1) await botWait(620); }

let lobby=null, lobbyKey='k'+rid()+rid(), searching=false, searchSince=0, matchHost=false, matching=false, onlineN=0, lastTracked='', searchTimer=null;
const SEARCH_LIMIT=25;
function presenceMeta(){ return {uid:uid||'', name:profile.name||'', av:profile.av||'', rating:profile.rating||1000, status: searching?'searching':(gs&&mode!=='tutor'?'playing':'idle'), since:searchSince}; }
async function lobbyTrack(){ if(!lobby || !lobby._ready) return; const m=presenceMeta(), k=JSON.stringify(m); if(k===lastTracked) return; lastTracked=k; try{ await lobby.track(m); }catch(e){} }
function renderOnline(){
  const txt=t('onlineN',{n:Math.max(1,onlineN)});
  $('onlineCnt').textContent=txt; $('onlineHome').textContent=txt;
  $('searchOnline').textContent=' · '+txt;
}
function lobbyStart(){
  if(!sb || lobby) return;
  lobby=sb.channel('lobby',{config:{presence:{key:lobbyKey},broadcast:{self:false}}});
  lobby.on('presence',{event:'sync'},()=>{
    const st=lobby.presenceState(), ids=new Set();
    Object.entries(st).forEach(([k,arr])=>{ const m=arr[0]||{}; ids.add(m.uid||k); });
    onlineN=ids.size; renderOnline(); if(searching) tryMatch(st);
  });
  lobby.on('broadcast',{event:'match'},({payload})=>{
    if(payload && payload.to===uid && searching){ stopSearch(true); toast(t('matchFound')); setHash('g-'+payload.gameId); joinGame(payload.gameId); }
  });
  lobby.subscribe(s=>{ if(s==='SUBSCRIBED'){ lobby._ready=true; lastTracked=''; lobbyTrack(); } });
}
function startSearch(){
  if(!uid || !db){ openProfile(); return; }
  if(gs) leave();
  searching=true; searchSince=Date.now(); matchHost=false; lobbyStart(); route();
  $('searchInfo').textContent=t('searchInfo',{s:SEARCH_LIMIT});
  clearInterval(searchTimer);
  searchTimer=setInterval(()=>{
    if(!searching){ clearInterval(searchTimer); return; }
    const sec=Math.floor((Date.now()-searchSince)/1000); $('searchTime').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
    if(sec>=SEARCH_LIMIT){ toast(t('noOpp')); startBot(); }
  },500);
  if(lobby && lobby._ready) tryMatch(lobby.presenceState());
}
function stopSearch(silent){ searching=false; clearInterval(searchTimer); if(!silent) route(); else lobbyTrack(); }
async function tryMatch(st){
  if(!searching || matching || !uid) return;
  const seen=new Map();
  Object.values(st).forEach(arr=>arr.forEach(m=>{ if(m.status==='searching' && m.uid && !seen.has(m.uid)) seen.set(m.uid,m); }));
  const list=[...seen.values()].sort((a,b)=>(a.since-b.since)||(a.uid<b.uid?-1:1));
  const i=list.findIndex(m=>m.uid===uid);
  if(i<0 || i%2===1) return;             // odd places wait for the invite from the player before them
  const partner=list[i+1]; if(!partner) return;
  matching=true; stopSearch(true); matchHost=true;
  gameId=rid(); mode='online'; ref=db.doc('games/'+gameId);
  gs=newGame(uid,null); gs.names={p1:profile.name||'',p2:''}; gs.avs={p1:profile.av||'',p2:''}; gs.ratings={p1:profile.rating||1000,p2:0};
  await save(); setHash('g-'+gameId); subscribe(); route();
  const gid=gameId;
  for(let k=0;k<5;k++){ if(!gs || gameId!==gid || gs.p2) break; try{ lobby.send({type:'broadcast',event:'match',payload:{to:partner.uid,from:uid,gameId:gid}}); }catch(e){} await new Promise(r=>setTimeout(r,1500)); }
  matching=false;
  setTimeout(()=>{ if(gs && gameId===gid && mode==='online' && !gs.p2 && matchHost){ leave(); startSearch(); } }, 6000);
}

}

}

function baseGain(r){ const lo=1000, hi=1600; if(r<=lo) return 50; if(r>=hi) return 25; return 50-25*(r-lo)/(hi-lo); }

const FPAL={1:['#f0b47c','#a8622e','#5b2e12'],2:['#ffffff','#b8c0c9','#666e78'],3:['#fff2b3','#e3ab33','#86590c'],4:['#effffd','#78d0d2','#23777f'],5:['#f2fcff','#8fd3ff','#7b6cff']};

  let out='';

  for(const side of [1,-1]) for(let i=0;i<n;i++){
    const phi = side>0 ? 78-i*15 : 102+i*15, R=48.5+(i%2?2.2:-0.6), rad=phi*Math.PI/180;

  }

function framed(el, rating, px){
  if(rating==null) return el;
  const size=px||parseFloat(el.style.width)||38, t=tierIdx(rating)+1;
  const w=document.createElement('span'); w.className='frl'; w.style.width=w.style.height=(size/0.633).toFixed(1)+'px';

  w.title=t_('tier_'+TIERS[t-1].k)+' · '+rating;
  const raw=el.innerHTML.trim(); w.innerHTML=laurelSVG(t, raw.startsWith('<svg') ? raw : avatarSVG(el.dataset.av, el.dataset.nm||el.textContent));
  return w;
}

function eloDelta(my, opp, score, games, mars){
  // win: 90-110% of the base (more for beating a stronger player); loss: same scale (more when a favourite loses)
  const E=1/(1+Math.pow(10,(opp-my)/400)), b=baseGain(my);
  let d = score ? b*(0.9+0.2*(1-E)) : -b*(0.9+0.2*E);
  if(mars) d*=1.2;
  return Math.round(d);
}
function ratingOf(s){ if(!gs) return null; if(mode==='bot') return s==='p1' ? (profile.rating||1000) : BOT_R; if(mode==='tutor') return null; if(mode==='local') return s==='p1' ? (profile.rating||1000) : null; if(gs[s]===uid) return profile.rating||1000; return (gs.ratings&&gs.ratings[s]) || null; }

function histLabel(b){ const vc=viewColor(); return b<0 ? t('histOff') : String(24-(vc==='w'? b : (b+12)%24)); }
function histMoves(tr){
  if(!tr || !tr.length) return t('histNone');
  const chains=[];
  for(let i=0;i+1<tr.length;i+=2){
    const f=tr[i], to=tr[i+1], last=chains[chains.length-1];

// ---- turn banner in the middle of the board ----
let lastBannerKey='';
function renderBanner(){
  const el=$('turnBanner'); if(!el) return;
  const ub=$('btnUndoB');
  if(ub){ const full = gs && gs.dice && gs.dice.length ? (gs.dice[0]===gs.dice[1]?4:2) : 0;
    const on = !!(gs && canPlay() && gs.rolled && gs.snap && gs.remaining.length<full && gs.remaining.length>0);
    ub.classList.toggle('hidden', !on); ub.title=t('undo'); ub.onclick=e=>{ e.stopPropagation(); undo(); }; }
  const hide=()=>{ el.classList.add('hidden'); lastBannerKey=''; };
  if(!gs || gs.phase==='over') return hide();
  let title='', sub='', btn=null, wait=false;
  const tutorMode = typeof tut!=='undefined' && mode==='tutor';
  if(gs.phase==='opening'){
    const s=openSlotToRoll();
    if(s){ title=t('bnOpenT'); sub = mode==='local' ? slotName(s) : t('bnOpenS'); if(gs.openLast && gs.openLast.tie && !gs.open.p1 && !gs.open.p2) sub=t('openTie',{a:gs.openLast.p1}); btn=t('rollFirst'); }
    else { title = mode==='bot' ? t('botThinking') : t('bnOppOpen'); wait=true; }
  } else if(gs.phase==='play' && !gs.rolled){
    if(tutorMode){ if(tut && !tut.done && TUT[tut.i].dice){ title=t('bnYour'); btn=t('roll'); } else return hide(); }
    else if(canPlay()){ title = mode==='local' ? t('bnColor',{c:colorName(gs.turn)}) : t('bnYour'); sub=t('bnRollS'); btn=t('roll'); }
    else { title = mode==='bot' ? t('bnBot') : t('bnOpp'); sub = slotName(slotOfColor(gs.turn)).split(' (')[0]; wait=true; }
  } else if(gs.phase==='play' && gs.rolled && canPlay() && mode!=='tutor' && !legalMoves(gs,gs.turn).length){ title=t('noMovesT'); wait=true; }
  else return hide();
  const key=[title,sub,btn,wait,gs.turn,gs.rollId].join('|');
  if(key===lastBannerKey) return; lastBannerKey=key;
  el.className='tb'+(wait?' wait':''); el.innerHTML='';
  const h=document.createElement('div'); h.className='tbt'+(wait?' dots':''); h.textContent=title; el.appendChild(h);
  if(sub){ const p=document.createElement('div'); p.className='tbs'; p.textContent=sub; el.appendChild(p); }
  if(btn){ const b=document.createElement('button'); b.className='cta'; b.textContent=btn; b.onclick=e=>{ e.stopPropagation(); roll(); }; el.appendChild(b); }
}

function renderHud(){
  if(!gs) return; resolveNames();
  const me=mySlot();
  const bottom = mode==='online' ? (me||'p1') : 'p1';
  plCard($('plTop'), bottom==='p1'?'p2':'p1'); plCard($('plBot'), bottom);

  const c=gs.turn, playing=canPlay();
  const moves = playing && gs.rolled ? legalMoves(gs,c) : [];
  let st='', rollLabel=t('roll'), rollOn=false, undoOn=false;
  if(gs.phase==='opening'){
    rollLabel=t('rollFirst');
    const s=openSlotToRoll(); rollOn=!!s;
    if(gs.openLast && gs.openLast.tie && !gs.open.p1 && !gs.open.p2) st=t('openTie',{a:gs.openLast.p1});
    else if(mode==='local' && s) st=t('openLocal',{n:slotName(s)});
    else if(s) st=t('openYour');
    else if(mode==='bot') st=t('botThinking');
    else if(mode==='online' && me) st=t('openWait');
    else st=t('openYour');
  } else if(gs.phase==='over'){
    st=t('won',{n: mode==='local'? colorName(gs.winner) : slotName(slotOfColor(gs.winner))});
  } else {
    const justOpened = gs.openLast && !gs.openLast.tie && gs.first.w && !gs.rolled;
    if(mode==='online' && !me) st=t('spectator',{c:colorName(c)});
    else if(!playing) st= mode==='bot' ? t('botTurn') : t('oppTurn');
    else if(mode==='tutor' && !gs.rolled){ st = tut && tut.done ? t('tutStepDone') : (TUT[tut.i].dice ? t('tutRoll') : ''); rollOn = !!(tut && !tut.done && TUT[tut.i].dice); }
    else if(!gs.rolled){ st = mode==='local' ? t('localRoll',{c:colorName(c)}) : t('yourRoll'); rollOn=true; }
    else if(!moves.length) st=t('noMoves');
    else if(selected===null) st=t('pick'); else st=t('where');
    if(justOpened){ const w=slotOfColor('w'); const a=gs.openLast[w], b=gs.openLast[w==='p1'?'p2':'p1']; st=t('openWon',{n: mode==='local'? slotName(w) : slotName(w),a,b})+'<br>'+st; }
    const full = gs.dice && gs.dice.length ? (gs.dice[0]===gs.dice[1]?4:2) : 0;
    undoOn = playing && gs.rolled && gs.remaining.length<full;
  }
  $('status').innerHTML=st;
  $('btnRoll').textContent=rollLabel; $('btnRoll').disabled=!rollOn;
  $('btnUndo').disabled=!undoOn;
  show('btnRoll', gs.phase!=='over'); show('btnUndo', gs.phase==='play');
  show('btnNew', gs.phase==='over' && (mode==='local' || !!me));
  show('ctlSec', gs.phase==='over' && (mode==='local' || !!me));
  renderHistory();
  show('btnCopy2', mode==='online');
  $('shareLbl').textContent = mode==='online' ? t('link') : mode==='bot' ? t('botGame') : mode==='tutor' ? t('tutorGame') : t('localGame');

  if(gs.phase==='over' && lastWinShown!==gameId+':'+gs.seq+':'+gs.winner){
    lastWinShown=gameId+':'+gs.seq+':'+gs.winner;
    lastDelta=null; recordResult(); renderMe(); if(mode==='local') sfx('win');
    const ws=slotOfColor(gs.winner), mars = gs.off[OPP(gs.winner)]===0;
    $('winTitle').textContent = mode==='local' ? t('winN',{n:slotName(ws)}) : (ws===me ? t('winYou') : (me ? t('winLose') : t('winN',{n:slotName(ws)})));
    $('winSub').textContent = (mars?t('mars'):t('one'))+' '+t('score',{a:gs.score.p1,b:gs.score.p2}) + (lastDelta!=null ? ' · '+t('ratingChange',{d:(lastDelta>=0?'+':'')+lastDelta, r:profile.rating}) + (mode==='bot' ? ' ('+t('botRated')+')' : '') : '');
    show('btnNew2', mode==='local' || !!me);
    setTimeout(()=>{ if(gs && gs.phase==='over') show('winOv',true); }, 600);
  } else if(gs.phase!=='over') show('winOv',false);
}

  function buildPickers(){

  const PIPS={1:[[50,50]],2:[[28,28],[72,72]],3:[[26,26],[50,50],[74,74]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[26,26],[74,26],[50,50],[26,74],[74,74]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]};
  let lastDiceKey='';
  function dieEl(v, used, anim, i){
    const d=document.createElement('div'); d.className='die'+(used?' used':'')+(anim?' roll':'');
    if(anim) d.style.animationDelay=(i*60)+'ms';
    const paint=x=>{ d.innerHTML='<svg viewBox="0 0 100 100" width="100%" height="100%">'+PIPS[x].map(([px,py])=>'<circle cx="'+px+'" cy="'+py+'" r="'+(x===1?12:9.5)+'" class="'+(x===1?'pip1':'pip')+'"/>').join('')+'</svg>'; };
    paint(anim ? 1+Math.floor(Math.random()*6) : v);
    if(anim){ let n=0; const iv=setInterval(()=>{ n++; if(n>=7){ clearInterval(iv); paint(v); } else paint(1+Math.floor(Math.random()*6)); }, 60); }
    return d;
  }

  applyTheme();
  let lastKey='', flightToken=0;
  // tap or drag a checker
  let drag=null;
  const boardEl=$('board');
  function ptFromEvent(ev){ const el=document.elementFromPoint(ev.clientX,ev.clientY); if(!el) return null; const tr=el.closest('.tslot'); if(tr) return {tray:true}; const pt=el.closest('.pt'); return pt?{b:+pt.dataset.b}:null; }
  boardEl.addEventListener('pointerdown',ev=>{
    if(ev.target.closest('#turnBanner') || ev.target.closest('#btnUndoB')) return;
    const pt=ev.target.closest('.pt'); if(!pt) return;
    const b=+pt.dataset.b; drag={b, x:ev.clientX, y:ev.clientY, moved:false, ghost:null, src:null};
    try{ boardEl.setPointerCapture(ev.pointerId); }catch(e){}
  });
  boardEl.addEventListener('pointermove',ev=>{
    if(!drag) return;
    if(!drag.moved){
      if(Math.hypot(ev.clientX-drag.x, ev.clientY-drag.y)<7) return;
      if(!canPlay()||!gs.rolled) { drag=null; return; }
      const c=gs.turn, p=p2(c,drag.b); if(!reachFrom(gs,c,p).size){ drag=null; return; }
      drag.moved=true; if(selected!==p){ selected=p; route(); }
      const pt=document.querySelector('.pt[data-b="'+drag.b+'"]'); const tip=pt && pt.querySelector('.ck.tip');
      const size=csPx()*0.92; const g=document.createElement('div'); g.className='ck '+c+' drag'; g.style.width=g.style.height=size+'px'; document.body.appendChild(g); drag.ghost=g;
      if(tip){ tip.style.visibility='hidden'; drag.src=tip; }
    }
    drag.ghost.style.left=ev.clientX+'px'; drag.ghost.style.top=ev.clientY+'px';
  });
  const endDrag=ev=>{
    if(!drag) return; const d=drag; drag=null;
    if(!d.moved){ onPoint(d.b); return; }
    d.ghost.remove(); if(d.src) d.src.style.visibility='';
    const hit=ptFromEvent(ev); if(!hit||!canPlay()) { route(); return; }
    const r=reachFrom(gs,gs.turn,selected); const to = hit.tray ? 24 : p2(gs.turn,hit.b);
    if(r.has(to)){ noFlight=true; playPath(r.get(to)); sfx('move'); } else { route(); }
  };
  boardEl.addEventListener('pointerup',endDrag);
  boardEl.addEventListener('pointercancel',()=>{ if(drag&&drag.ghost) drag.ghost.remove(); if(drag&&drag.src) drag.src.style.visibility=''; drag=null; });

  function stopFlights(){ flightToken++; document.querySelectorAll('.fly').forEach(e=>e.remove()); }
  function csPx(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs'))||40; }
  function slotXY(b,k,col){
    const size=csPx()*0.92;
    if(b<0){ const vc=viewColor(); const tr = col===vc ? $('trayBot') : $('trayTop'); const r=tr.getBoundingClientRect(); return {x:r.left+r.width/2-size/2, y:r.top+r.height/2-size/2, size}; }
    const pt=document.querySelector('.pt[data-b="'+b+'"]'); if(!pt) return null;
    const r=pt.getBoundingClientRect(), top=pt.parentElement.classList.contains('top'), kk=Math.min(k,4);
    return {x:r.left+(r.width-size)/2, y: top ? r.top+2+kk*size : r.bottom-2-(kk+1)*size, size};
  }
  function runFlights(col, flat, finalBoard){
    const pairs=[]; for(let i=0;i+1<flat.length;i+=2) pairs.push([flat[i],flat[i+1]]);
    if(!pairs.length) return;
    const sg=S(col), cnt=finalBoard.map(n=>Math.max(0,n*sg)); const plan=[];
    for(let i=pairs.length-1;i>=0;i--){ const [f,to]=pairs[i]; if(to>=0) cnt[to]--; cnt[f]++; plan[i]={f,to,kf:cnt[f]-1,kt:to>=0?cnt[to]:0}; }
    // hide arriving checkers until they land
    const hidden=plan.map(p=>{ if(p.to<0||p.kt>4) return null; const pt=document.querySelector('.pt[data-b="'+p.to+'"]'); const el=pt && pt.querySelectorAll('.ck')[p.kt]; if(el) el.classList.add('ghost'); return el; });
    const token=flightToken; let i=0;
    const step=()=>{
      if(token!==flightToken) return;
      if(i>=plan.length) return;
      const p=plan[i], el=hidden[i]; i++;
      const a=slotXY(p.f,p.kf,col), z=slotXY(p.to,p.kt,col);
      if(!a||!z){ if(el) el.classList.remove('ghost'); sfx('move'); step(); return; }
      const fl=document.createElement('div'); fl.className='ck '+col+' fly'; fl.style.cssText='left:'+a.x+'px;top:'+a.y+'px;width:'+a.size+'px;height:'+a.size+'px';
      document.body.appendChild(fl);
      const dx=z.x-a.x, dy=z.y-a.y, dist=Math.hypot(dx,dy), dur=Math.min(520, 230+dist*0.45);
      const an=fl.animate([
        {transform:'translate(0,0) scale(1)', filter:'drop-shadow(0 2px 2px rgba(0,0,0,.25))'},
        {transform:'translate('+dx*0.5+'px,'+dy*0.5+'px) scale(1.14)', filter:'drop-shadow(0 14px 10px rgba(0,0,0,.28))', offset:.5},
        {transform:'translate('+dx+'px,'+dy+'px) scale(1)', filter:'drop-shadow(0 2px 2px rgba(0,0,0,.25))'}
      ],{duration:dur, easing:'cubic-bezier(.45,.05,.3,1)'});
      an.onfinish=()=>{ fl.remove(); if(token!==flightToken) return; if(el){ el.classList.remove('ghost'); el.classList.add('land'); } sfx('move'); setTimeout(step,40); };
    };
    step();
  }
  return {
    applyTheme,
    relayout(){},
    sync(){
      const data = gs || {board:freshBoard(), off:{w:0,b:0}, turn:'w', phase:'idle'};
      const key = JSON.stringify([data.board, data.off, gs?viewColor():'w', selected, gs&&gs.turn, gs&&gs.phase, gs&&gs.rolled, gs&&gs.remaining, gs&&gs.dice, gs&&gs.open, gs&&gs.openRound, gs&&gs.rollId, gs&&gs.trail, gs&&gs.last, mode, prefs.board]);
      if(key===lastKey && !pendingAnim) return;
      lastKey=key; stopFlights();
      const vc = gs ? viewColor() : 'w';
      const vToB = v => vc==='w' ? v : (v+12)%24;
      const c=data.turn, playing=gs && canPlay();
      const moves = playing && gs.rolled ? legalMoves(gs,c) : [];
      const fromSet=new Set(moves.map(m=>m.from));
      const reach = (playing && selected!==null) ? reachFrom(gs,c,selected) : new Map();
      const tg=new Set([...reach.keys()]);
      const steps={}; reach.forEach((path,to)=>steps[to]=path.length);
      const lastSet=new Set(gs ? ((gs.trail&&gs.trail.length)?gs.trail:(!gs.rolled?(gs.last||[]):[])) : []);
      const fresh=new Set(gs && gs.trail ? gs.trail.filter((x,i)=>i%2===1) : []);
      const rows={rTL:[11,10,9,8,7,6], rTR:[5,4,3,2,1,0], rBL:[12,13,14,15,16,17], rBR:[18,19,20,21,22,23]};
      const cs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs'))||40;
      for(const [rid,vs] of Object.entries(rows)){
        const el=$(rid); el.innerHTML='';
        vs.forEach(v=>{
          const b=vToB(v), n=data.board[b], col=n>0?'w':n<0?'b':null, cnt=Math.abs(n), pp=p2(c,b);
          const pt=document.createElement('div'); pt.className='pt'+((v%2)?' alt':'');
          if(lastSet.has(b)) pt.classList.add('last');
          if(col===c && fromSet.has(pp)) pt.classList.add('can');
          if(col===c && selected===pp && playing) pt.classList.add('sel');
          const isT=tg.has(pp); if(isT){ pt.classList.add('tgt'); if(steps[pp]>1) pt.classList.add('combo'); if(Math.min(cnt,5)>=5) pt.classList.add('full'); }
          const stack=document.createElement('div'); stack.className='stack';
          const vis=Math.min(cnt,5);
          for(let k=0;k<vis;k++){
            const ck=document.createElement('div'); ck.className='ck '+col+(k===vis-1?' tip':'');
            if(k===vis-1 && cnt>5) ck.dataset.n=cnt;
            if(k===vis-1 && fresh.has(b)) ck.classList.add('pop');
            stack.appendChild(ck);
          }
          if(isT && vis<5){ const g=document.createElement('div'); g.className='gh'+(steps[pp]>1?' combo':''); stack.appendChild(g); }
          pt.appendChild(stack);
          const nl=document.createElement('span'); nl.className='num'; nl.textContent=24-v; pt.appendChild(nl);
          pt.dataset.b=b;
          el.appendChild(pt);
        });
      }
      // trays: viewer's own bear-off on top (next to their home)
      const tray=(el,col)=>{
        el.innerHTML=''; const k=data.off[col];
        const lb=document.createElement('div'); lb.className='tc'; lb.textContent=k; el.appendChild(lb);
        for(let i=0;i<k;i++){ const s=document.createElement('i'); s.className=col; el.appendChild(s); }
        const on = gs && col===c && tg.has(24); el.classList.toggle('tgt',!!on);
        el.onclick=()=>{ if(on) onTray(); };
      };
      tray($('trayBot'), vc); tray($('trayTop'), OPP(vc));
      // dice
      const dL=$('diceL'), dR=$('diceR'); dL.innerHTML=''; dR.innerHTML='';
      const anim = performance.now() < rollAnimUntil;
      if(gs && gs.phase==='opening'){
        const me = mode==='online' ? (mySlot()||'p1') : 'p1';
        const showV = s => gs.open[s] || (gs.openLast && gs.openLast.tie && !gs.open.p1 && !gs.open.p2 ? gs.openLast[s] : 0);
        ['p1','p2'].forEach(s=>{ const v=showV(s); if(!v) return; (s===me?dR:dL).appendChild(dieEl(v,false,anim,0)); });
      } else if(gs && gs.phase==='play' && gs.dice && gs.dice.length){
        const dbl=gs.dice[0]===gs.dice[1], faces = dbl ? [gs.dice[0],gs.dice[0],gs.dice[0],gs.dice[0]] : gs.dice;
        let rem=gs.remaining.slice(); const host = gs.turn===vc ? dR : dL;
        faces.forEach((f,i)=>{ const j=rem.indexOf(f); const used=j<0; if(!used) rem.splice(j,1); host.appendChild(dieEl(f,used,anim,i)); });
      }
      if(pendingAnim && gs){ const a=pendingAnim; pendingAnim=null; if(noFlight) noFlight=false; else runFlights(a.col, a.flat, data.board); }
    }
  };
}

// reachable targets from one checker, including combined moves (e.g. 3+4 -> 7)
function reachFrom(st,c,from){
  const out=new Map();
  (function walk(state, pos, path){
    for(const m of legalMoves(state,c)){
      if(m.from!==pos) continue;
      const np=path.concat([m]);
      const prev=out.get(m.to);
      if(!prev || np.length<prev.length || (np.length===prev.length && np[0].die<prev[0].die)) out.set(m.to,np);
      if(m.to<24) walk(applyMove(state,c,m), m.to, np);
    }
  })(st, from, []);
  return out;
}
function onPoint(b){
  if(!canPlay() || !gs.rolled) return;
  const c=gs.turn, p=p2(c,b);
  if(selected!==null){ const r=reachFrom(gs,c,selected); if(r.has(p)){ playPath(r.get(p)); return; } }
  const r=reachFrom(gs,c,p);
  if(r.size){
    if(r.size===1 && selected!==p){ playPath([...r.values()][0]); return; }
    selected = selected===p ? null : p; route(); return;
  }
  if(selected!==null){ selected=null; route(); }
}
function onTray(){
  if(!canPlay() || selected===null) return;
  const r=reachFrom(gs,gs.turn,selected); if(r.has(24)) playPath(r.get(24));
}

// ================= profile & auth =================
let profile = {name:'', guest:true, played:0, won:0, av:'', rating:1000, rgames:0};
let authUser=null;
function initials(n){ return (n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function renderMeAvatar(){ const a=$('btnMe').querySelector('.av'); if(!a) return; if(profile.av && AVATARS[profile.av]) avatarInto(a, profile.av, profile.name); if(profile.name && !a.classList.contains('ghost')) a.replaceWith(framed(a.cloneNode(true), profile.rating||1000, 28)); }
function renderMe(){
  const b=$('btnMe');
  if(authUser && profile.name) b.innerHTML='<span class="av"></span><span class="nmx"></span>';
  else b.innerHTML='<span class="av ghost">?</span><span class="nmx"></span>';
  if(authUser && profile.name) b.querySelector('.av').textContent=initials(profile.name);
  b.querySelector('.nmx').textContent = (authUser && profile.name) ? profile.name : t('login');
  renderMeAvatar();
}
async function saveProfile(){
  renderMe(); if(gs) renderHud();
  if(!sb || !uid) return;
  const {error}=await sb.from('profiles').upsert({id:uid, name:profile.name||'', av:profile.av||'', rating:profile.rating||1000, rgames:profile.rgames|0, played:profile.played|0, won:profile.won|0, updated_at:new Date().toISOString()});
  if(error) toast(t('saveErr'));
}
async function onSignedIn(u, wantedName){
  authUser=u; uid=u.id;
  db={ doc:p=>gameRef(p.split('/')[1]) };
  user={ profiles: async ids=>{ const {data}=await sb.from('profiles').select('id,name').in('id',ids); const o={}; (data||[]).forEach(r=>o[r.id]={name:r.name}); return o; } };
  const {data}=await sb.from('profiles').select('name,played,won,av,rating,rgames').eq('id',uid).maybeSingle();
  const pickedAv=profile.av||''; profile={ name:(data&&data.name)||wantedName||'', played:(data&&data.played)||0, won:(data&&data.won)||0, av:(data&&data.av)||pickedAv, rating:(data&&data.rating)||1000, rgames:(data&&data.rgames)||0, guest:!!u.is_anonymous };
  if(!data || (wantedName && !data.name) || (pickedAv && !data.av)) await saveProfile();
  bootState='ok'; bootNote(); renderMe(); $('btnCreate').disabled=false; lastTracked=''; lobbyTrack();
  const h=location.hash.replace('#',''); if(h.startsWith('g-') && h.slice(2)!==gameId) joinGame(h.slice(2));
  if(!profile.name) openProfile();
}
// Accounts are nickname + password. Supabase needs an email, so the nickname is encoded into a
// placeholder address on the reserved ".invalid" domain (never receives mail). Login is case-insensitive.
const NICK_RE=/^[\p{L}\p{N}_.\- ]{3,16}$/u;
function nickEmail(n){ const bytes=new TextEncoder().encode(n.trim().toLowerCase()); let bits=''; for(const x of bytes) bits+=x.toString(2).padStart(8,'0');
  const A='abcdefghijklmnopqrstuvwxyz234567'; let out=''; for(let i=0;i<bits.length;i+=5) out+=A[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)]; return 'u'+out+'@nardy.invalid'; }
function openProfile(){
  const box=$('profBox'); box.innerHTML='';
  const h=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
  const msg=h('p','note'); msg.style.color='var(--accent)'; msg.style.minHeight='0';
  const fail=e=>{ msg.textContent=(e&&e.message)||t('authErr'); };
  const nick=h('input','field'); nick.maxLength=20; nick.placeholder=t('nickPh'); nick.value=profile.name||'';
  if(!sb){ box.append(h('h2',null,t('loginT')), h('p',null,t('noOnline'))); const c=h('button',null,t('close')); c.onclick=()=>show('profOv',false); box.append(c); show('profOv',true); return; }
  if(!authUser){
    box.append(h('h2',null,t('loginT')), h('p',null,t('loginD2')), h('label',null,t('avatarT')), avatarPicker(), h('label',null,t('nick')), nick);
    const pw=h('input','field'); pw.type='password'; pw.placeholder=t('pass'); pw.autocomplete='current-password';
    const row=h('div','r'); const si=h('button',null,t('signIn')); const su=h('button','cta',t('signUp')); row.append(si,su);
    const sep=h('div','orline',t('orGuest'));
    const gu=h('button',null,t('guest')); gu.style.width='100%';
    const nickOk=()=>{ const v=nick.value.trim(); if(!NICK_RE.test(v)){ msg.textContent=t('nickRule'); nick.focus(); return null; } return v; };
    const authFail=e=>{ const m=(e&&e.message)||''; msg.textContent = /already registered|already exists/i.test(m) ? t('nickTaken') : /invalid login credentials/i.test(m) ? t('badLogin') : (m||t('authErr')); };
    si.onclick=async()=>{ msg.textContent=''; const v=nickOk(); if(!v) return; if(!pw.value){ msg.textContent=t('passShort'); pw.focus(); return; }
      si.disabled=true; const {data,error}=await sb.auth.signInWithPassword({email:nickEmail(v), password:pw.value}); si.disabled=false;
      if(error) return authFail(error); show('profOv',false); await onSignedIn(data.user, v); };
    su.onclick=async()=>{ msg.textContent=''; const v=nickOk(); if(!v) return; if(pw.value.length<6){ msg.textContent=t('passShort'); pw.focus(); return; }
      su.disabled=true; const {data,error}=await sb.auth.signUp({email:nickEmail(v), password:pw.value, options:{data:{nick:v}}}); su.disabled=false;
      if(error) return authFail(error); if(!data.session){ msg.textContent=t('authErr'); return; } show('profOv',false); await onSignedIn(data.user, v); };
    gu.onclick=async()=>{ const v=nick.value.trim(); if(!v){ msg.textContent=t('needNick'); nick.focus(); return; } gu.disabled=true;
      const {data,error}=await sb.auth.signInAnonymously(); gu.disabled=false; if(error) return fail(error); show('profOv',false); await onSignedIn(data.user, v); };
    pw.onkeydown=e=>{ if(e.key==='Enter') si.click(); };
    nick.onkeydown=e=>{ if(e.key==='Enter') pw.focus(); };
    box.append(pw, row, msg, sep, gu);
  } else {
    const av=h('div','av big'); avatarInto(av, profile.av, profile.name); box.append(framed(av, profile.rating||1000, 64), h('h2',null,profile.name||t('guestName')), h('p',null, profile.guest ? t('guestAcc') : (authUser.email && !/@nardy\.invalid$/.test(authUser.email) ? authUser.email : t('profT'))));
    const st=h('div','stats'); const rate = profile.played ? Math.round(profile.won/profile.played*100)+'%' : '—';
    [[profile.played,t('played')],[profile.won,t('wins')],[rate,t('rate')]].forEach(([v,l])=>{ const d=h('div'); d.append(h('b',null,String(v)), h('span',null,l)); st.appendChild(d); });
    box.append(rankBlock(), st, h('label',null,t('avatarT')), avatarPicker(()=>{ saveProfile(); avatarInto(av, profile.av, profile.name); const old=box.querySelector('.frl'); if(old) old.replaceWith(framed(av, profile.rating||1000, 64)); }), h('label',null,t('nick')), nick);
    const col=h('div','col'); const sv=h('button','cta',t('saveN')); const cl=h('button',null,t('close')); const lo=h('button','linkbtn',t('signOut'));
    sv.onclick=async()=>{ const v=nick.value.trim(); if(!v){ msg.textContent=t('needNick'); return; } profile.name=v; await saveProfile(); show('profOv',false); };
    nick.onkeydown=e=>{ if(e.key==='Enter') sv.click(); };
    cl.onclick=()=>show('profOv',false);
    lo.onclick=async()=>{ await sb.auth.signOut(); leave(); authUser=null; uid=null; db=null; user=null; profile={name:'',guest:true,played:0,won:0,av:'',rating:1000,rgames:0}; bootState='nologin'; bootNote(); renderMe(); openProfile(); };
    col.append(sv,cl,lo); box.append(col,msg);
  }
  show('profOv',true); setTimeout(()=>nick.focus(),50);
}

// ---- leaderboard ----
async function openLeaderboard(){
  show('lbOv',true); const list=$('lbList'); list.innerHTML='<div class="empty">'+t('lbLoading')+'</div>';
  let rows=null; try{ rows=await lbFetch(); }catch(e){ rows=null; }
  list.innerHTML='';
  if(rows===null){ list.innerHTML='<div class="empty"></div>'; list.firstChild.textContent=t('lbErr'); return; }
  if(!rows.length){ const e=document.createElement('div'); e.className='empty'; e.textContent=t('lbEmpty'); list.appendChild(e); return; }
  rows.forEach((r,i)=>{
    const row=document.createElement('div'); row.className='lbrow'+(r.id===uid?' me':'');
    const pos=document.createElement('div'); pos.className='pos'+(i<3?' g'+(i+1):''); pos.textContent=i+1;
    const a=document.createElement('span'); a.className='av'; avatarInto(a, r.av, r.name||'?');
    const avw=document.createElement('div'); avw.appendChild(framed(a, r.rating||1000, 38));
    const who=document.createElement('div'); who.className='who'; const nm=document.createElement('b'); nm.textContent=(r.name||t('guestName'))+(r.id===uid?' · '+t('lbYou'):'');
    const sub=document.createElement('span'); sub.textContent=t('tier_'+TIERS[tierIdx(r.rating||1000)].k)+' · '+(r.won||0)+'–'+Math.max(0,(r.played||0)-(r.won||0)); who.append(nm,sub);
    const rt=document.createElement('div'); rt.className='rt'; rt.textContent=r.rating||1000;
    row.append(pos,avw,who,rt); list.appendChild(row);
  });
  if(!rows.some(r=>r.id===uid)){ const e=document.createElement('div'); e.className='empty'; e.style.padding='14px 6px 2px'; e.textContent=t('lbNotYou'); list.appendChild(e); }
}

async function lbFetch(){
  if(!sb || !uid) return null;
  const {data,error}=await sb.from('profiles').select('id,name,av,rating,won,played,rgames').gt('rgames',0).order('rating',{ascending:false}).limit(50);
  if(error) return null; return data||[];
}

let lastDelta=null;
function recordResult(){
  if(!(mode==='online' || mode==='bot') || !mySlot() || gs.phase!=='over') return;
  const key=gameId+':'+gs.score.p1+':'+gs.score.p2; const done=store.get('counted',[]);
  if(done.includes(key)) return; done.push(key); store.set('counted',done.slice(-80));
  const me=mySlot(), opp=me==='p1'?'p2':'p1', iWon=slotOfColor(gs.winner)===me, mars=gs.off[OPP(gs.winner)]===0;
  const oppR=(gs.ratings&&gs.ratings[opp])||1000, d=Math.round(eloDelta(profile.rating||1000, oppR, iWon?1:0, profile.rgames||0, mars) * (mode==='bot' ? BOT_FACTOR : 1));
  profile.rating=Math.max(100,(profile.rating||1000)+d); profile.rgames=(profile.rgames||0)+1; lastDelta=d;
  profile.played++; if(iWon){ profile.won++; sfx('win'); }
  saveProfile();
}

// ================= boot =================
let bootState='pending';
function bootNote(){ $('onlineNote').textContent = bootState==='ok' ? t('onlineOk') : bootState==='nologin' ? t('needLogin') : bootState==='none' ? t('noOnline') : ''; }
async function boot(){
  applyLang(); $('togSound').classList.toggle('on',prefs.sound);
  renderMe();
  scene3d = build2D();
  route();
  if(!window.supabase){ bootState='none'; bootNote(); $('btnCreate').disabled=true; return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  lobbyStart();
  const {data:{session}} = await sb.auth.getSession();
  if(session && session.user) await onSignedIn(session.user);
  else { bootState='nologin'; bootNote(); $('btnCreate').disabled=false; setTimeout(openProfile, 300); }
}
window.addEventListener('hashchange',()=>{ const h=location.hash.replace('#',''); if(db && h.startsWith('g-') && h.slice(2)!==gameId) joinGame(h.slice(2)); });
boot();
