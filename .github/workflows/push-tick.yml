name: push-tick
# Sends due tournament reminders (web push). The server sends each one only once.
on:
  schedule:
    - cron: '*/10 9-16 * * 0,6'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST https://zndzvicklrkxkrpmkybg.supabase.co/functions/v1/game \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_RN7RCyueFTrdIUyOllJKWA_wxMp2Bpz' \
            -d '{"action":"push_tick"}'
