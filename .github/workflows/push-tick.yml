name: push-tick
# Sends due tournament reminders (web push) and the evening streak reminder. The server sends each one only once.
on:
  schedule:
    - cron: '*/10 9-16 * * 0,6'
    # 0.61: the evening reminder (19:00 Kyiv = 17:00 UTC in winter); the server sends it once a day
    - cron: '3 17 * * *'
    - cron: '33 17 * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST https://zndzvicklrkxkrpmkybg.supabase.co/functions/v1/game \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_RN7RCyueFTrdIUyOllJKWA_wxMp2Bpz' \
            -d '{"action":"push_tick"}'
          echo
          curl -sS -X POST https://zndzvicklrkxkrpmkybg.supabase.co/functions/v1/game \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_RN7RCyueFTrdIUyOllJKWA_wxMp2Bpz' \
            -d '{"action":"tour_state"}' | head -c 20000
