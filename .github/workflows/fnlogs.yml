name: fnlogs
# Edge function errors of the last hours (Supabase logs API): status codes, times and messages.
on: workflow_dispatch
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - env: { SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}' }
        run: |
          q() { curl -sS -G "https://api.supabase.com/v1/projects/zndzvicklrkxkrpmkybg/analytics/endpoints/logs" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --data-urlencode "iso_timestamp_start=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)" --data-urlencode "iso_timestamp_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --data-urlencode "sql=$1" | head -c 20000; echo; }
          echo "== edge status"; q "select splitByString(' | ', event_message)[2] as s, count() as n from logs where source = 'function_edge_logs' group by s order by n desc"
          echo "== edge errors by hour"; q "select toStartOfHour(timestamp) as h, splitByString(' | ', event_message)[2] as s, count() as n from logs where source = 'function_edge_logs' and s not in ('200','204') group by h, s order by h desc limit 80"
          echo "== fn messages"; q "select timestamp, event_message from logs where source = 'function_logs' and event_message != 'shutdown' and event_message not like 'booted%' order by timestamp desc limit 80"
