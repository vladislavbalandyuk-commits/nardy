name: radiocheck
# Looks up candidate stations in the Radio Browser directory and checks that each HTTPS stream answers with audio.
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          q(){ curl -s -A "nardy-radiocheck" "https://de1.api.radio-browser.info/json/stations/search?$1&hidebroken=true&order=votes&reverse=true&limit=4" | python3 -c "import sys,json;[print(x['name'][:40],'|',x['url_resolved'],'|',x['codec'],x['bitrate'],'|',x['homepage'],'|ok',x['lastcheckok']) for x in json.load(sys.stdin)]"; }
          echo "== streams"
          for u in https://online.radioroks.ua/RadioROKS_Ukr_HD https://online.radioroks.ua/RadioROKS_HD https://online.radiojazz.ua/RadioJazz_Gold https://online.radiojazz.ua/RadioJazz_Christmas_HD https://ice5.somafm.com/groovesalad-128-mp3 https://ice6.somafm.com/illstreet-128-mp3 https://kexp-mp3-128.streamguys1.com/kexp128.mp3 https://knkx-live-a.edge.audiocdn.com/6285_64k https://www.wwoz.org/listen/hi https://radio.ukr.radio/ur2-mp3 https://radio.ukr.radio/ur1-mp3 https://online.hitfm.ua/HitFM_Ukr_HD https://online.kissfm.ua/KissFM_HD; do printf "%s " $u; curl -sL -m 6 -A "Mozilla/5.0" -o /tmp/x -w "%{http_code} %{content_type} %{size_download}\n" "$u" || true; echo; done
