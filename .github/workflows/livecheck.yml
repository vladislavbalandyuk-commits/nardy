name: livecheck
# Quick check of the live site without a browser: the version in index.html and that the side files answer.
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://nardy-nine.vercel.app/ -o i.html; echo "index $(wc -c < i.html) bytes"; grep -o "APP_VERSION='[^']*'\|[a-zA-Z]\+=\"0\.[0-9]*\.[0-9]*\"" i.html | head -3; grep -o '0\.2[0-9]\.[0-9]' i.html | sort | uniq -c | sort -rn | head -3
          for f in $(grep -o '\(en\|news\|av\|pt\)\.js?v=[0-9a-f]*\|skins\.css?v=[0-9a-f]*' i.html | sort -u); do echo "$f $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://nardy-nine.vercel.app/$f)"; done
      - run: |
          for id in photo-1756926760361-a24c8f6efeff photo-1683314680278-4537ba929037 photo-1752756992329-961db6366376 photo-1635547821500-77542481940c photo-1721378552373-5f260ab03ba9 photo-1785146556084-07bafff72bc1 photo-1593871295829-1aae9c21de92 photo-1758413352991-45807c8f741b; do echo "$id $(curl -s -o /dev/null -w '%{http_code} %{size_download}' "https://images.unsplash.com/$id?w=90&q=60&auto=format&fit=crop")"; done
          for f in fx/smoke_07.webp fx/star_06.webp; do echo "$f $(curl -s -o /dev/null -w '%{http_code}' https://nardy-nine.vercel.app/$f)"; done
