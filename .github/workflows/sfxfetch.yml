name: sfxfetch
# Downloads CC0 Kenney audio packs (casino + impact), converts to mp3 and uploads them as an artifact to pick from.
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p raw out && cd raw
          for r in kenney-casino-audio-for-godot kenney-impact-sounds-for-godot; do
            curl -sSfL "https://github.com/Loppansson/$r/archive/HEAD.zip" -o $r.zip && unzip -qo $r.zip || echo "FAIL $r"
          done
          curl -sSfL "https://opengameart.org/sites/default/files/kenney_casino-audio.zip" -o oga.zip && unzip -qo oga.zip -d oga || echo "FAIL oga"
          find . -iname "*.ogg" | sort > ../list.txt; wc -l ../list.txt
          cd ..
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1 || true
          while read f; do b=$(basename "$f" .ogg); ffmpeg -loglevel error -y -i "raw/$f" -ac 1 -b:a 64k "out/$b.mp3"; done < list.txt
          ls out | wc -l; ls out | tr '\n' ' '
      - uses: actions/upload-artifact@v4
        with: { name: sfx, path: out }
