# Deploys the Supabase Edge Function "game" whenever it changes on main.
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_ACCESS_TOKEN = a personal access token from https://supabase.com/dashboard/account/tokens
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy "game"
        run: supabase functions deploy game --project-ref zndzvicklrkxkrpmkybg --no-verify-jwt --yes
